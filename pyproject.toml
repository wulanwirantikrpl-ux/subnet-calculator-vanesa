[project]
name = "subnet-calculator-sqa"
version = "1.0.0"
description = "Kalkulator subnet IPv4 dan VLSM berbasis FastAPI untuk pembelajaran jaringan."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-ra"
